openapi: 3.1.0
info:
  title: IKEA DIRIGERA local API
  version: 0.1.0
  summary: Community maintained description of the local REST API on the IKEA DIRIGERA hub.
  description: |
    The DIRIGERA hub exposes an HTTPS API on port 8443 of your local network. IKEA
    doesn't document it, so this specification is assembled from community clients
    and checked against a real hub. See the README for every source.

    The hub uses a self-signed certificate, so clients must disable certificate
    verification or pin the hub certificate.

    Every operation carries two vendor extensions:

    * `x-verified`: `true` when the operation was called against a real hub while
      writing this spec and its response matched the schema. Operations that change
      state haven't been verified yet, and their success status is given as `2XX`
      since the exact code isn't known.
    * `x-sources`: the community projects that use the operation, as GitHub
      `owner/repo` slugs. `x-source-repositories` at the root links each one.

    Real-time updates are pushed over a websocket that OpenAPI can't describe. It's
    covered by `asyncapi.yaml` in the same repository.

    Many string fields hold values the hub adds to over time (device types,
    capabilities, icons). They are typed as plain strings with the known values in
    the description, so generated clients keep working when IKEA adds new ones.
  contact:
    url: https://github.com/bombsimon/dirigera-openapi
  license:
    name: MIT
    identifier: MIT
x-source-repositories:
  0xtosh/denkigera: https://github.com/0xtosh/denkigera
  bombsimon/dirigera-rs: https://github.com/bombsimon/dirigera-rs
  dvdgeisler/DirigeraClient: https://github.com/dvdgeisler/DirigeraClient
  hagronnestad/dirigera: https://github.com/hagronnestad/dirigera
  kaliberjs/ikea-dirigera: https://github.com/kaliberjs/ikea-dirigera
  Leggin/dirigera: https://github.com/Leggin/dirigera
  lpgera/dirigera: https://github.com/lpgera/dirigera
  mattias73andersson/dirigera-client-poc: https://github.com/mattias73andersson/dirigera-client-poc
  openhab/openhab-addons: https://github.com/openhab/openhab-addons/tree/main/bundles/org.openhab.binding.dirigera
  phillipp/dirigera: https://github.com/phillipp/dirigera
  rtoma/dirigera-prometheus-exporter: https://github.com/rtoma/dirigera-prometheus-exporter
  salex-org/ikea-dirigera-client: https://github.com/salex-org/ikea-dirigera-client
  sanjoyg/dirigera_platform: https://github.com/sanjoyg/dirigera_platform
  thembo-sec/dirigera_client: https://github.com/thembo-sec/dirigera_client
  uboness/homebridge-dirigera: https://github.com/uboness/homebridge-dirigera
  wjtje/DIRIGERA: https://github.com/wjtje/DIRIGERA
  zinen/node-dirigera-promise: https://github.com/zinen/node-dirigera-promise
servers:
  - url: https://{host}:8443/v1
    description: DIRIGERA hub on the local network
    variables:
      host:
        default: 192.168.1.100
        description: IP address or hostname of the hub.
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Pair a client with the hub to obtain a bearer token.
  - name: Home
    description: Snapshot of everything the hub knows about.
  - name: Hub
    description: Status and firmware of the hub itself.
  - name: Devices
    description: Read and control individual devices.
  - name: Device groups
    description: Control many devices at once by room, device set, audio group or type.
  - name: Rooms
  - name: Device sets
    description: User defined groups of devices, shown as "groups" in the IKEA app.
  - name: Scenes
    description: Scenes and automations.
  - name: Remote links
    description: Which devices a remote or controller operates.
  - name: Users
  - name: Music
    description: Sonos integration.

paths:
  /oauth/authorize:
    get:
      tags:
        - Authentication
      operationId: authorize
      summary: Start pairing
      description: |
        First step of pairing, an OAuth 2 authorization code flow with PKCE. Generate a
        random code verifier, send its SHA-256 base64url challenge and keep the
        returned code. Then press the action button on the bottom of the hub and call
        `POST /oauth/token` within 60 seconds.
      security: []
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - openhab/openhab-addons
        - thembo-sec/dirigera_client
        - mattias73andersson/dirigera-client-poc
        - phillipp/dirigera
        - wjtje/DIRIGERA
        - bombsimon/dirigera-rs
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            type: string
            const: homesmart.local
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: code_challenge
          in: query
          required: true
          description: Base64url encoded SHA-256 hash of the code verifier, without padding.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
      responses:
        "200":
          description: Authorization code to exchange for a token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationCode"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Authentication
      operationId: cancelAuthorization
      summary: Cancel pairing
      description: Cancels a pending authorization started with `GET /oauth/authorize`.
      security: []
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - code
                - code_verifier
              properties:
                code:
                  type: string
                code_verifier:
                  type: string
      responses:
        "2XX":
          description: Authorization cancelled.
        default:
          $ref: "#/components/responses/Error"
  /oauth/authorize/{transactionId}:
    get:
      tags:
        - Authentication
      operationId: getAuthorizationStatus
      summary: Poll an authorization transaction
      description: The response format isn't known yet.
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "2XX":
          description: Authorization status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /oauth/token:
    post:
      tags:
        - Authentication
      operationId: createToken
      summary: Exchange a code for a token
      description: |
        Second step of pairing. The hub answers with an error until the action button
        on the hub has been pressed, so clients usually retry every second for up to 60
        seconds. The returned token doesn't expire.
      security: []
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - openhab/openhab-addons
        - thembo-sec/dirigera_client
        - mattias73andersson/dirigera-client-poc
        - phillipp/dirigera
        - rtoma/dirigera-prometheus-exporter
        - wjtje/DIRIGERA
        - bombsimon/dirigera-rs
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "2XX":
          description: Bearer token to use for every other request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        default:
          $ref: "#/components/responses/Error"

  /home:
    get:
      tags:
        - Home
      operationId: getHome
      summary: Get everything
      description: |
        Returns the hub, all devices, rooms, scenes, device sets, users and adaptive
        lighting profiles in a single response. This is the only way to list device
        sets and adaptive profiles.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - openhab/openhab-addons
        - rtoma/dirigera-prometheus-exporter
        - zinen/node-dirigera-promise
      responses:
        "200":
          description: The complete home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        default:
          $ref: "#/components/responses/Error"

  /hub/status:
    get:
      tags:
        - Hub
      operationId: getHubStatus
      summary: Get the hub
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      responses:
        "200":
          description: The hub as a device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/check:
    put:
      tags:
        - Hub
      operationId: checkFirmwareUpdate
      summary: Check for firmware updates
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      responses:
        "2XX":
          description: Check started. Progress shows up in the hub's `ota*` attributes.
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/update:
    put:
      tags:
        - Hub
      operationId: installFirmwareUpdate
      summary: Install a downloaded firmware update
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      responses:
        "2XX":
          description: Update started.
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/environment:
    put:
      tags:
        - Hub
      operationId: setFirmwareEnvironment
      summary: Switch firmware channel
      description: Moves the hub to another firmware channel. Pre-release channels may be unstable.
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment
              properties:
                environment:
                  type: string
                  description: "Known values: `prod`, `alpha`, `dev`."
      responses:
        "2XX":
          description: Channel changed.
        default:
          $ref: "#/components/responses/Error"
  /hub/cloud-integration:
    put:
      tags:
        - Hub
      operationId: setCloudIntegration
      summary: Toggle the persistent cloud connection
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        "2XX":
          description: Setting changed.
        default:
          $ref: "#/components/responses/Error"

  /devices:
    get:
      tags:
        - Devices
      operationId: listDevices
      summary: List devices
      description: Every paired device, including the hub itself.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - rtoma/dirigera-prometheus-exporter
        - salex-org/ikea-dirigera-client
        - hagronnestad/dirigera
        - kaliberjs/ikea-dirigera
        - 0xtosh/denkigera
        - phillipp/dirigera
        - sanjoyg/dirigera_platform
        - bombsimon/dirigera-rs
      responses:
        "200":
          description: All devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Error"
  /devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags:
        - Devices
      operationId: getDevice
      summary: Get a device
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - 0xtosh/denkigera
        - kaliberjs/ikea-dirigera
        - phillipp/dirigera
        - bombsimon/dirigera-rs
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Devices
      operationId: updateDevice
      summary: Control or configure a device
      description: |
        Changes one or more attributes. The body is an array of patches, and every
        client sends a single element. Only attributes listed in the device's
        `capabilities.canReceive` can be changed.

        This is also how a device is renamed (`customName`) and how hub settings
        such as `coordinates` are changed, using the hub's device id.
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - sanjoyg/dirigera_platform
        - hagronnestad/dirigera
        - kaliberjs/ikea-dirigera
        - 0xtosh/denkigera
        - bombsimon/dirigera-rs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatchList"
            examples:
              turnOn:
                summary: Turn on
                value:
                  - attributes:
                      isOn: true
              dim:
                summary: Dim over one second
                value:
                  - attributes:
                      lightLevel: 40
                    transitionTime: 1000
              color:
                summary: Set color
                value:
                  - attributes:
                      colorHue: 240
                      colorSaturation: 0.8
              rename:
                summary: Rename
                value:
                  - attributes:
                      customName: Desk lamp
      responses:
        "2XX":
          description: Change accepted. The new state arrives as a `deviceStateChanged` event.
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Devices
      operationId: deleteDevice
      summary: Remove a device
      description: Unpairs the device from the hub.
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      responses:
        "2XX":
          description: Device removed.
        default:
          $ref: "#/components/responses/Error"
  /devices/{deviceId}/identify:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    put:
      tags:
        - Devices
      operationId: identifyDevice
      summary: Blink a device
      description: Makes the device blink or beep for `period` seconds. Send `0` to stop.
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - uboness/homebridge-dirigera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - period
              properties:
                period:
                  type: integer
                  minimum: 0
                  description: Seconds to identify for. `0` stops it.
                  examples:
                    - 30
      responses:
        "2XX":
          description: Identification started or stopped.
        default:
          $ref: "#/components/responses/Error"

  /devices/all:
    patch:
      tags:
        - Device groups
      operationId: updateDevicesByType
      summary: Control every device of a type
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      parameters:
        - name: deviceType
          in: query
          required: true
          schema:
            type: string
            description: A device type such as `light` or `outlet`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatchList"
      responses:
        "2XX":
          description: Change accepted.
        default:
          $ref: "#/components/responses/Error"
  /devices/room/{roomId}:
    patch:
      tags:
        - Device groups
      operationId: updateDevicesInRoom
      summary: Control every device in a room
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - hagronnestad/dirigera
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/DeviceTypeFilter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatchList"
      responses:
        "2XX":
          description: Change accepted.
        default:
          $ref: "#/components/responses/Error"
  /devices/set/{deviceSetId}:
    patch:
      tags:
        - Device groups
      operationId: updateDevicesInSet
      summary: Control every device in a device set
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - sanjoyg/dirigera_platform
      parameters:
        - $ref: "#/components/parameters/DeviceSetId"
        - $ref: "#/components/parameters/DeviceTypeFilter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatchList"
      responses:
        "2XX":
          description: Change accepted.
        default:
          $ref: "#/components/responses/Error"
  /devices/audio_group/{audioGroupId}:
    patch:
      tags:
        - Device groups
      operationId: updateDevicesInAudioGroup
      summary: Control every speaker in an audio group
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
      parameters:
        - name: audioGroupId
          in: path
          required: true
          description: The `audioGroup` attribute of a speaker.
          schema:
            type: string
        - $ref: "#/components/parameters/DeviceTypeFilter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatchList"
      responses:
        "2XX":
          description: Change accepted.
        default:
          $ref: "#/components/responses/Error"
  /step/{targetId}:
    post:
      tags:
        - Device groups
      operationId: stepLightLevel
      summary: Step the light level up or down
      description: Relative dimming, as done by holding a button on a remote.
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
      parameters:
        - name: targetId
          in: path
          required: true
          description: Id of a device, room or device set.
          schema:
            type: string
        - $ref: "#/components/parameters/DeviceTypeFilter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - stepSize
              properties:
                type:
                  type: string
                  description: "Known values: `lightLevel`."
                stepSize:
                  type: integer
                  description: Percentage points to step, negative to step down.
                transitionTime:
                  type: integer
                  description: Transition time in milliseconds.
      responses:
        "2XX":
          description: Step accepted.
        default:
          $ref: "#/components/responses/Error"

  /rooms:
    get:
      tags:
        - Rooms
      operationId: listRooms
      summary: List rooms
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - salex-org/ikea-dirigera-client
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Rooms
      operationId: createRoom
      summary: Create a room
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "2XX":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identifier"
        default:
          $ref: "#/components/responses/Error"
  /rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags:
        - Rooms
      operationId: getRoom
      summary: Get a room
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Rooms
      operationId: updateRoom
      summary: Rename or restyle a room
      description: Replaces name, icon and color, so send all three.
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "2XX":
          description: Room updated.
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Rooms
      operationId: deleteRoom
      summary: Delete a room
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      responses:
        "2XX":
          description: Room deleted. Its devices end up without a room.
        default:
          $ref: "#/components/responses/Error"
  /rooms/{roomId}/devices:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    patch:
      tags:
        - Rooms
      operationId: moveDevicesToRoom
      summary: Move devices into a room
      description: Moving a device is done on the target room, there is no room field to change on a device.
      x-verified: false
      x-sources:
        - lpgera/dirigera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceIds
              properties:
                deviceIds:
                  type: array
                  items:
                    type: string
      responses:
        "2XX":
          description: Devices moved.
        default:
          $ref: "#/components/responses/Error"

  /device-set:
    post:
      tags:
        - Device sets
      operationId: createDeviceSet
      summary: Create a device set
      description: Device sets are listed through `GET /home`, there is no list endpoint.
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSetInput"
      responses:
        "2XX":
          description: Device set created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identifier"
        default:
          $ref: "#/components/responses/Error"
  /device-set/{deviceSetId}:
    parameters:
      - $ref: "#/components/parameters/DeviceSetId"
    put:
      tags:
        - Device sets
      operationId: updateDeviceSet
      summary: Rename a device set
      x-verified: false
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSetInput"
      responses:
        "2XX":
