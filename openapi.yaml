        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Scenes
      operationId: createScene
      summary: Create a scene
      description: |
        Only `info` is strictly needed. Without `type` the scene becomes a
        `userScene`, and without `triggers` it gets a single `app` trigger. Device
        attributes in `actions` aren't validated. An unknown `type` returns `400`
        listing the allowed values, and an empty body returns `500`.

        Wake up and wind down scenes have no `actions`, their fade is a
        `transitionLight` command.

        Sensor automations are ordinary `customScene`s with `event` triggers: actions
        when a door opens or closes, "while open" (an `undo` trigger on close), and
        phone notifications.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - IKEA Home smart app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
            examples:
              buttonPress:
                summary: Run on a shortcut button press
                value:
                  type: customScene
                  info:
                    name: Movie night
                    icon: scenes_clapper
                  triggers:
                    - type: controller
                      trigger:
                        controllerType: shortcutController
                        clickPattern: singlePress
                        buttonIndex: 0
                        deviceId: 3f1c9a2e-0d4b-4c55-9a51-0c8f6a1d2b3c_1
                  actions:
                    - type: device
                      deviceId: 6b2d4e8f-1a3c-4b5d-8e7f-9a0b1c2d3e4f_1
                      attributes:
                        isOn: true
                        lightLevel: 20
                  commands: []
              wakeUp:
                summary: Wake up on weekdays
                value:
                  id: 5a6b7c8d-9e0f-4a1b-9c2d-3e4f5a6b7c8e
                  type: wakeUpScene
                  info:
                    name: Rise and shine
                    icon: scenes_sun_horizon
                  undoAllowedDuration: 30
                  triggers:
                    - type: time
                      disabled: false
                      trigger:
                        time: "06:30"
                        days:
                          - Mon
                          - Tue
                          - Wed
                          - Thu
                          - Fri
                      endTriggerEvent:
                        type: duration
                        trigger:
                          duration: 3600
                  actions: []
                  commands:
                    - type: device
                      id: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f_1
                      enabled: true
                      commands:
                        - type: transitionLight
                          duration: 1800
                          startState:
                            isOn: true
                            lightLevel: 1
                            colorTemperature: 2200
                          endState:
                            isOn: true
                            lightLevel: 100
                            colorTemperature: 4000
              doorOpenTooLong:
                summary: Notify when a door stays open for 15 minutes
                value:
                  type: customScene
                  info:
                    name: open delay scene
                    icon: scenes_clean_sparkles
                  undoAllowedDuration: 1
                  triggers:
                    - type: event
                      disabled: false
                      trigger:
                        deviceId: a1b2c3d4-5e6f-4a1b-9c2d-3e4f5a6b7c8d_1
                        filter:
                          attribute:
                            isOpen: true
                        notifications:
                          - type: openedLonger
                        delay:
                          type: schedule
                          duration: 900
                    - type: event
                      disabled: false
                      trigger:
                        deviceId: a1b2c3d4-5e6f-4a1b-9c2d-3e4f5a6b7c8d_1
                        filter:
                          attribute:
                            isOpen: false
                        notifications:
                          - type: openedLonger
                        delay:
                          type: cancel
                  actions: []
                  commands: []
      responses:
        "200":
          description: Scene created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identifier"
        default:
          $ref: "#/components/responses/Error"
