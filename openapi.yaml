openapi: 3.1.0
info:
  title: IKEA DIRIGERA local API
  version: 0.1.0
  summary: Community maintained description of the local REST API on the IKEA DIRIGERA hub.
  description: |
    The DIRIGERA hub exposes an HTTPS API on port 8443 of your local network. IKEA
    doesn't document it, so this specification is assembled from community clients
    and checked against a real hub. See the README for every source.

    The hub certificate is signed by IKEA's private "IKEA Home smart Root CA",
    which no system trusts, so clients must disable certificate verification or pin
    the hub certificate.

    Most writes are applied asynchronously. The hub answers `202 Accepted` before
    the change has happened, so a read straight afterwards can still return the old
    value. Wait for the matching websocket event instead.

    Request bodies are validated, and a failed validation returns `400` with a
    message such as `"name" is required`. A body that doesn't match what the server
    expects in other ways often returns `500` with `Something went wrong`.

    Every operation carries two vendor extensions:

    * `x-verified`: `true` when the operation was called against a real hub
      (firmware 2.975.4) while writing this spec and its response matched the
      schema. Operations that haven't been called give their success status as
      `2XX`, since the exact code isn't known.
    * `x-sources`: the community projects that use the operation, as GitHub
      `owner/repo` slugs. `x-source-repositories` at the root links each one.
      `IKEA Home smart app` means the request was seen in traffic from IKEA's own
      app. An empty list means the route was found by probing a hub and no known
      client uses it.

    IKEA's app generates the `id` of new rooms, scenes and adaptive profiles
    itself and sends it in the create request. The hub keeps a given id, and
    generates one when it's left out.

    Real-time updates are pushed over a websocket that OpenAPI can't describe. It's
    covered by `asyncapi.yaml` in the same repository.

    Many string fields hold values the hub adds to over time (device types,
    capabilities, icons). They are typed as plain strings with the known values in
    the description, so generated clients keep working when IKEA adds new ones.
  contact:
    url: https://github.com/bombsimon/dirigera-openapi
  license:
    name: MIT
    identifier: MIT
x-source-repositories:
  0xtosh/denkigera: https://github.com/0xtosh/denkigera
  0xtosh/helios: https://github.com/0xtosh/helios
  bombsimon/dirigera-rs: https://github.com/bombsimon/dirigera-rs
  DanielShifman/IKEA-IoT-Interface: https://github.com/DanielShifman/IKEA-IoT-Interface
  domjancik/dirigera-readaptive: https://github.com/domjancik/dirigera-readaptive
  dvdgeisler/DirigeraClient: https://github.com/dvdgeisler/DirigeraClient
  elmarbeckmann/hubdeck: https://github.com/elmarbeckmann/hubdeck
  EryXInc/dirigera-tui: https://github.com/EryXInc/dirigera-tui
  hagronnestad/dirigera: https://github.com/hagronnestad/dirigera
  kaliberjs/ikea-dirigera: https://github.com/kaliberjs/ikea-dirigera
  lednifrolg/dirigent: https://github.com/lednifrolg/dirigent
  Leggin/dirigera: https://github.com/Leggin/dirigera
  lpgera/dirigera: https://github.com/lpgera/dirigera
  matteovivona/homebridge-dirigera-ng: https://github.com/matteovivona/homebridge-dirigera-ng
  mattias73andersson/dirigera-client-poc: https://github.com/mattias73andersson/dirigera-client-poc
  nyanshell/dirigera-ctl: https://github.com/nyanshell/dirigera-ctl
  openhab/openhab-addons: https://github.com/openhab/openhab-addons/tree/main/bundles/org.openhab.binding.dirigera
  phillipp/dirigera: https://github.com/phillipp/dirigera
  rtoma/dirigera-prometheus-exporter: https://github.com/rtoma/dirigera-prometheus-exporter
  salex-org/ikea-dirigera-client: https://github.com/salex-org/ikea-dirigera-client
  sanjoyg/dirigera_platform: https://github.com/sanjoyg/dirigera_platform
  sheepherder/dirigera-mqtt-bridge: https://github.com/sheepherder/dirigera-mqtt-bridge
  thembo-sec/dirigera_client: https://github.com/thembo-sec/dirigera_client
  uboness/homebridge-dirigera: https://github.com/uboness/homebridge-dirigera
  wayju/dirigera-monitor: https://github.com/wayju/dirigera-monitor
  wjtje/DIRIGERA: https://github.com/wjtje/DIRIGERA
  zinen/node-dirigera-promise: https://github.com/zinen/node-dirigera-promise
servers:
  - url: https://{host}:8443/v1
    description: DIRIGERA hub on the local network
    variables:
      host:
        default: 192.168.1.100
        description: IP address or hostname of the hub.
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Pair a client with the hub to obtain a bearer token.
  - name: Home
    description: Snapshot of everything the hub knows about.
  - name: Hub
    description: Status and firmware of the hub itself.
  - name: Devices
    description: Read and control individual devices.
  - name: Device groups
    description: Control many devices at once by room, device set, audio group or type.
  - name: Rooms
  - name: Device sets
    description: User defined groups of devices, shown as "groups" in the IKEA app.
  - name: Scenes
    description: Scenes and automations.
  - name: Remote links
    description: Which devices a remote, controller or sensor operates.
  - name: Adaptive profiles
    description: |
      Schedules of light level and color temperature over the day. A light follows
      one when its `deviceOnBehavior` points at it. They are listed in
      `GET /home`, there is no separate list route.
  - name: Activity log
    description: History of door, window and water leak sensor events.
  - name: Users
  - name: Music
    description: Sonos integration.

paths:
  /oauth/authorize:
    get:
      tags:
        - Authentication
      operationId: authorize
      summary: Start pairing
      description: |
        First step of pairing, an OAuth 2 authorization code flow with PKCE. Generate a
        random code verifier, send its SHA-256 base64url challenge and keep the
        returned code. Then press the action button on the bottom of the hub and call
        `POST /oauth/token` within 60 seconds.
      security: []
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - openhab/openhab-addons
        - thembo-sec/dirigera_client
        - mattias73andersson/dirigera-client-poc
        - phillipp/dirigera
        - wjtje/DIRIGERA
        - bombsimon/dirigera-rs
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            type: string
            const: homesmart.local
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: code_challenge
          in: query
          required: true
          description: Base64url encoded SHA-256 hash of the code verifier, without padding.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
      responses:
        "200":
          description: Authorization code to exchange for a token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationCode"
        "409":
          description: |
            Another pairing is already pending, with the error
            `Already one ongoing pairing request`. A pending code expires after
            about 60 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Authentication
      operationId: cancelAuthorization
      summary: Cancel pairing
      description: |
        Cancels a pending authorization started with `GET /oauth/authorize`.

        The hub routes this as `DELETE`, not `POST` as some clients send it. The body
        must be form encoded. Without it, or with the same fields as JSON or query
        parameters, the hub answers `400` with the message `[object Object]`. After
        cancelling, `POST /oauth/token` with the code returns `401`.
      security: []
      x-verified: true
      x-sources:
        - dvdgeisler/DirigeraClient
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - code
                - code_verifier
              properties:
                code:
                  type: string
                code_verifier:
                  type: string
      responses:
        "202":
          description: Authorization cancelled.
        default:
          $ref: "#/components/responses/Error"
  /oauth/authorize/{transactionId}:
    get:
      tags:
        - Authentication
      operationId: getAuthorizationStatus
      summary: Poll an authorization transaction
      description: |
        The response format isn't known yet, and neither is where the transaction id
        comes from. It's not the pairing code: passing that returns `401` with
        `Invalid transaction id`. Unlike the rest of pairing, this needs a token.
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "2XX":
          description: Authorization status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /oauth/token:
    post:
      tags:
        - Authentication
      operationId: createToken
      summary: Exchange a code for a token
      description: |
        Second step of pairing. The hub answers with an error until the action button
        on the hub has been pressed, so clients usually retry every second for up to 60
        seconds.

        The token is an ES256 JWT whose `exp` claim is ten years after it was issued,
        so in practice it doesn't expire. A request without a valid body returns
        `500`, not `400`.

        Errors from this operation only have an `error` field, which holds the
        message:

        * `403` `Button not pressed or presence time stamp timed out.` until the
          button is pressed.
        * `403` `Pairing request timed out` once the code is about 60 seconds old.
        * `401` `Invalid authorization code` for an expired or cancelled code.
      security: []
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - openhab/openhab-addons
        - thembo-sec/dirigera_client
        - mattias73andersson/dirigera-client-poc
        - phillipp/dirigera
        - rtoma/dirigera-prometheus-exporter
        - wjtje/DIRIGERA
        - bombsimon/dirigera-rs
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Bearer token to use for every other request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        default:
          $ref: "#/components/responses/Error"

  /home:
    get:
      tags:
        - Home
      operationId: getHome
      summary: Get everything
      description: |
        Returns the hub, all devices, rooms, scenes, device sets, users and adaptive
        lighting profiles in a single response. This is the only way to list device
        sets and adaptive profiles.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - openhab/openhab-addons
        - rtoma/dirigera-prometheus-exporter
        - zinen/node-dirigera-promise
        - IKEA Home smart app
      responses:
        "200":
          description: The complete home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        default:
          $ref: "#/components/responses/Error"

  /health:
    get:
      tags:
        - Hub
      operationId: getHealth
      summary: Check that the API is up
      description: Needs no token.
      security: []
      x-verified: true
      x-sources: []
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    examples:
                      - OK
        default:
          $ref: "#/components/responses/Error"
  /config:
    get:
      tags:
        - Hub
      operationId: getConfig
      summary: Get the IKEA cloud endpoints
      description: |
        The hostnames the hub and the app use to reach the IKEA cloud for remote
        access.
      x-verified: true
      x-sources: []
      responses:
        "200":
          description: Cloud endpoints for the hub's region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remoteApiEndpoint:
                    type: string
                    examples:
                      - remote.eu-central-1.api.homesmart.ikea.com
                  remoteWsEndpoint:
                    type: string
                    examples:
                      - wss.eu-central-1.api.homesmart.ikea.com
                  remoteTokenEndpoint:
                    type: string
                    examples:
                      - auth.eu-central-1.api.homesmart.ikea.com
        default:
          $ref: "#/components/responses/Error"

  /hub/status:
    get:
      tags:
        - Hub
      operationId: getHubStatus
      summary: Get the hub
      description: |
        Works without a token too. The hub then answers `206` with only its name, its
        firmware version and the API version, which is enough to identify a hub before
        pairing.
      security:
        - bearerAuth: []
        - {}
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - 0xtosh/helios
        - DanielShifman/IKEA-IoT-Interface
        - hagronnestad/dirigera
        - nyanshell/dirigera-ctl
        - salex-org/ikea-dirigera-client
        - wayju/dirigera-monitor
        - IKEA Home smart app
      responses:
        "200":
          description: The hub as a device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "206":
          description: Sent instead of `200` when the request has no token.
          content:
            application/json:
              schema:
                type: object
                required:
                  - attributes
                  - apiVersion
                properties:
                  attributes:
                    type: object
                    properties:
                      customName:
                        type: string
                      firmwareVersion:
                        type: string
                        examples:
                          - 2.975.4
                  apiVersion:
                    type: string
                    examples:
                      - 1.6.7
        default:
          $ref: "#/components/responses/Error"
  /hub/thread:
    get:
      tags:
        - Hub
      operationId: getThreadNetwork
      summary: Get the Thread network
      description: |
        State of the hub's Thread border router.

        `operationalDataSet` is the Thread active operational dataset, which includes
        the network key. Treat it as a secret.
      x-verified: true
      x-sources: []
      responses:
        "200":
          description: Thread border router state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  borderAgentID:
                    type: string
                  operationalDataSet:
                    type: string
                    description: Active operational dataset as hex encoded TLVs.
                  extendedAddress:
                    type: string
                  configured:
                    type: boolean
                  threadState:
                    type: string
                    description: "Known values: `threadConnected`."
                  threadJoiningState:
                    type: string
                    description: "Known values: `idle`."
                  nat64Enabled:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Hub
      operationId: setThreadNetwork
      summary: Change the Thread network
      description: |
        The route exists, but the request body isn't known yet. It presumably takes an
        operational dataset to join or form a network.
      x-verified: false
      x-sources: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "2XX":
          description: Change accepted.
        default:
          $ref: "#/components/responses/Error"
  /hub/homekit:
    get:
      tags:
        - Hub
      operationId: getHomeKitIntegration
      summary: Get the HomeKit integration
      description: |
        Whether the hub is paired with Apple Home. The HomeKit accessory server itself
        listens on port 8000.
      x-verified: true
      x-sources:
        - IKEA Home smart app
      responses:
        "200":
          description: HomeKit pairing state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrationPaired:
                    type: boolean
                  integrationPairingAllowed:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /hub/matter-bridge:
    get:
      tags:
        - Hub
      operationId: getMatterBridge
      summary: Get the Matter bridge
      description: |
        Whether the hub's devices are shared with a Matter controller such as Apple
        Home or Google Home. `integrationPairingPayload` and
        `integrationManualPairingCode` are the setup QR payload and code, so treat
        them as secrets. The cloud relay answers `403`.
      x-verified: true
      x-sources:
        - IKEA Home smart app
      responses:
        "200":
          description: Matter bridge state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterBridgeStatus"
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/schedule:
    get:
      tags:
        - Hub
      operationId: getFirmwareUpdateSchedule
      summary: Get the automatic update schedule
      x-verified: true
      x-sources: []
      responses:
        "200":
          description: When the hub installs updates on its own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareUpdateSchedule"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Hub
      operationId: setFirmwareUpdateSchedule
      summary: Change the automatic update schedule
      description: |
        Takes the same shape as the `GET` response. `time` must be a valid 24 hour
        `HH:mm`, otherwise the hub answers `400` with
        `The field 'time' needs to have format HH:mm`. `enabled` isn't type checked.
      x-verified: true
      x-sources: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareUpdateSchedule"
      responses:
        "202":
          description: Schedule changed.
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/check:
    put:
      tags:
        - Hub
      operationId: checkFirmwareUpdate
      summary: Check for firmware updates
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - DanielShifman/IKEA-IoT-Interface
        - salex-org/ikea-dirigera-client
      responses:
        "202":
          description: Check started. Progress shows up in the hub's `ota*` attributes.
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/update:
    put:
      tags:
        - Hub
      operationId: installFirmwareUpdate
      summary: Install a downloaded firmware update
      description: Also answers `202` when no update is waiting, and then does nothing.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - salex-org/ikea-dirigera-client
      responses:
        "202":
          description: Update started.
        default:
          $ref: "#/components/responses/Error"
  /hub/ota/environment:
    put:
      tags:
        - Hub
      operationId: setFirmwareEnvironment
      summary: Switch firmware channel
      description: |
        Moves the hub to another firmware channel. Pre-release channels may be unstable.

        This route doesn't exist on firmware 2.975.4, which answers `404`. It's kept for
        hubs on older firmware.
      deprecated: true
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - environment
              properties:
                environment:
                  type: string
                  description: "Known values: `prod`, `alpha`, `dev`."
      responses:
        "2XX":
          description: Channel changed.
        default:
          $ref: "#/components/responses/Error"
  /hub/cloud-integration:
    put:
      tags:
        - Hub
      operationId: setCloudIntegration
      summary: Toggle the persistent cloud connection
      x-verified: false
      x-sources:
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        "2XX":
          description: Setting changed.
        default:
          $ref: "#/components/responses/Error"

  /devices:
    get:
      tags:
        - Devices
      operationId: listDevices
      summary: List devices
      description: Every paired device, including the hub itself.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - rtoma/dirigera-prometheus-exporter
        - salex-org/ikea-dirigera-client
        - hagronnestad/dirigera
        - kaliberjs/ikea-dirigera
        - 0xtosh/denkigera
        - phillipp/dirigera
        - sanjoyg/dirigera_platform
        - bombsimon/dirigera-rs
      responses:
        "200":
          description: All devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Error"
  /devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags:
        - Devices
      operationId: getDevice
      summary: Get a device
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - 0xtosh/denkigera
        - kaliberjs/ikea-dirigera
        - phillipp/dirigera
        - bombsimon/dirigera-rs
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: |
            The id isn't a valid device id, such as one without the `_1` suffix. The
            message is `invalid device id: <id>`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The id is valid but no device has it. The message is `Something went wrong`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Devices
      operationId: updateDevice
      summary: Control or configure a device
      description: |
        Changes one or more attributes. The body is an array of patches. Every client
        sends a single element, but the hub accepts several, and an empty array. Only
        attributes listed in the device's `capabilities.canReceive` can be changed.

        `attributes` is validated against a set of allowed shapes. An unknown
        attribute, a wrong type or a value out of range (such as `lightLevel` of `0`,
        `101` or `71.5`) all return `400` with
        `"attributes" does not match any of the allowed types`. Sending the body as a
        single object instead of an array returns `500`.

        This is also how a device is renamed (`customName`), and how the hub is
        renamed and its settings such as `coordinates` are changed, using the hub's
        device id.

        Besides `attributes`, a patch element can carry `room` to move the device
        and `customIcon` to change its icon.
      x-verified: true
      x-sources:
        - lpgera/dirigera
        - Leggin/dirigera
        - dvdgeisler/DirigeraClient
        - thembo-sec/dirigera_client
        - openhab/openhab-addons
        - sanjoyg/dirigera_platform
        - hagronnestad/dirigera
        - kaliberjs/ikea-dirigera
        - 0xtosh/denkigera
        - bombsimon/dirigera-rs
        - domjancik/dirigera-readaptive
        - 0xtosh/helios
        - IKEA Home smart app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatchList"
            examples:
              turnOn:
                summary: Turn on
                value:
                  - attributes:
                      isOn: true
              dim:
                summary: Dim over one second
                value:
                  - attributes:
                      lightLevel: 40
                    transitionTime: 1000
              color:
